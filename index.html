<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Christmas Tree - Creative Tech</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Times+New+Roman&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #000000;
            --gold: #d4af37;
            --cream: #fceea7;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Times New Roman', serif;
            color: var(--gold);
            user-select: none;
        }

        /* UI Layer */
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .ui-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Title */
        h1 {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 56px;
            margin: 0;
            background: linear-gradient(to bottom, #ffffff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            letter-spacing: 2px;
        }

        /* Controls */
        .controls-area {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px 30px;
            font-family: 'Cinzel', serif;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            outline: none;
        }

        .glass-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            box-shadow: 0 0 15px var(--gold);
        }

        input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .hint-text {
            color: var(--cream);
            font-size: 14px;
            opacity: 0.7;
            margin-top: 5px;
        }

        /* Loader */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-top: 2px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            letter-spacing: 2px;
            font-size: 14px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Webcam (Invisible) */
        #webcam-container {
            position: absolute;
            bottom: 0;
            right: 0;
            opacity: 0;
            pointer-events: none;
        }
    </style>

    <!-- Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
        }
    }
    </script>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner"></div>
        <div class="loading-text">LOADING HOLIDAY MAGIC</div>
    </div>

    <!-- Main Canvas -->
    <canvas id="canvas"></canvas>

    <!-- UI Overlay -->
    <div id="ui-container">
        <h1>Merry Christmas</h1>

        <div class="controls-area">
            <div class="upload-wrapper">
                <button class="glass-btn">ADD MEMORIES</button>
                <input type="file" id="imageInput" accept="image/*">
            </div>
            <div class="hint-text">Press 'H' to Hide Controls</div>
        </div>
    </div>

    <!-- Hidden CV Elements -->
    <div id="webcam-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <!-- Application Logic -->
    <script type="module">
        import * as THREE from 'three';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

        // --- Configuration & State ---
        const CONFIG = {
            colors: {
                gold: 0xd4af37,
                cream: 0xfceea7,
                green: 0x0f3b1e,
                red: 0x8a0303
            },
            particleCount: 1500,
            dustCount: 2500
        };

        const STATE = {
            mode: 'TREE', // TREE, SCATTER, FOCUS
            handData: null,
            focusTarget: null, // The specific photo particle to focus on
            time: 0
        };

        // --- Helper: Procedural Textures ---
        function createCandyCaneTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            // White background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 64, 64);

            // Red Stripes
            ctx.strokeStyle = '#8a0303';
            ctx.lineWidth = 12;
            ctx.beginPath();
            for(let i = -64; i < 128; i += 24) {
                ctx.moveTo(i, -10);
                ctx.lineTo(i + 40, 74);
            }
            ctx.stroke();

            return new THREE.CanvasTexture(canvas);
        }

        function createDefaultPhotoTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#fceea7';
            ctx.fillRect(0, 0, 512, 512);

            ctx.font = 'bold 60px Cinzel';
            ctx.fillStyle = '#d4af37';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('JOYEUX', 256, 220);
            ctx.fillText('NOEL', 256, 292);

            // Border
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 20;
            ctx.strokeRect(0,0,512,512);

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // --- Class: Particle ---
        class Particle {
            constructor(mesh, type) {
                this.mesh = mesh;
                this.type = type; // 'DECOR', 'PHOTO', 'DUST'
                this.originalPos = mesh.position.clone();
                this.targetPos = new THREE.Vector3();
                this.targetRot = new THREE.Euler();

                // Random velocity for scatter rotation
                this.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.02,
                    (Math.random() - 0.5) * 0.02,
                    (Math.random() - 0.5) * 0.02
                );

                // Initialize random targets for scatter
                this.calculateScatterTarget();
            }

            update(mode, focusTargetMesh) {
                // Determine Target Position/Rotation based on mode
                let tPos = new THREE.Vector3();
                let tRot = new THREE.Euler();

                if (mode === 'TREE') {
                    // Tree targets are calculated at generation, but let's recalculate/retrieve logic if needed
                    // For simplicity, we stored tree positions in originalPos or recalculate
                    // Here we assume originalPos was the tree formation
                    tPos.copy(this.originalPos);
                    tRot.set(this.mesh.rotation.x, this.mesh.rotation.y, this.mesh.rotation.z); // Static tree rot
                }
                else if (mode === 'SCATTER') {
                    tPos.copy(this.scatterPos);
                    // Continuous rotation in scatter
                    this.mesh.rotation.x += this.velocity.x;
                    this.mesh.rotation.y += this.velocity.y;
                    this.mesh.rotation.z += this.velocity.z;
                    // We don't lerp rotation in scatter, we drive it by velocity,
                    // except to transition. For simplicity, just let it spin.
                    // But for lerp consistency, we use current as target
                    tRot.copy(this.mesh.rotation);
                }
                else if (mode === 'FOCUS') {
                    if (this.type === 'PHOTO' && this.mesh === focusTargetMesh) {
                        tPos.set(0, 2, 35); // Camera front
                        // Rotation to face camera
                        tRot.set(0, 0, 0);
                    } else {
                        // Push others away
                        tPos.copy(this.scatterPos).multiplyScalar(1.5);
                        tRot.copy(this.mesh.rotation);
                    }
                }

                // Apply Lerp
                this.mesh.position.lerp(tPos, 0.05);

                if (mode !== 'SCATTER') {
                    // Smooth rot transition for Tree/Focus
                    this.mesh.rotation.x = THREE.MathUtils.lerp(this.mesh.rotation.x, tRot.x, 0.05);
                    this.mesh.rotation.y = THREE.MathUtils.lerp(this.mesh.rotation.y, tRot.y, 0.05);
                    this.mesh.rotation.z = THREE.MathUtils.lerp(this.mesh.rotation.z, tRot.z, 0.05);
                }

                // Handle Scale
                let targetScale = 1;
                if (mode === 'FOCUS' && this.type === 'PHOTO' && this.mesh === focusTargetMesh) {
                    targetScale = 4.5;
                }
                this.mesh.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.05);
            }

            calculateScatterTarget() {
                // Sphere radius 8~20
                const r = 8 + Math.random() * 12;
                const phi = Math.acos( -1 + ( 2 * Math.random() ) );
                const theta = Math.sqrt( 1500 * Math.PI ) * phi;
                this.scatterPos = new THREE.Vector3(
                    r * Math.cos(theta) * Math.sin(phi),
                    r * Math.sin(theta) * Math.sin(phi),
                    r * Math.cos(phi)
                );
            }
        }

        // --- Main Application ---
        class App {
            constructor() {
                this.particles = [];
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.composer = null;
                this.mainGroup = null;
                this.vision = null;
                this.video = document.getElementById('webcam');

                this.init();
            }

            async init() {
                // 1. Scene & Camera
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 2, 50);

                // 2. Renderer
                this.renderer = new THREE.WebGLRenderer({
                    canvas: document.getElementById('canvas'),
                    antialias: true
                });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.renderer.toneMapping = THREE.ReinhardToneMapping;
                this.renderer.toneMappingExposure = 2.2;

                // 3. Environment & Lights
                const pmremGenerator = new THREE.PMREMGenerator(this.renderer);
                this.scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

                const ambient = new THREE.AmbientLight(0xffffff, 0.6);
                this.scene.add(ambient);

                const pLight = new THREE.PointLight(0xffaa00, 2, 100);
                this.scene.add(pLight);

                const spot1 = new THREE.SpotLight(CONFIG.colors.gold, 1200);
                spot1.position.set(30, 40, 40);
                spot1.angle = 0.5;
                spot1.penumbra = 0.5;
                this.scene.add(spot1);

                const spot2 = new THREE.SpotLight(0x0044ff, 600); // Cold contrast
                spot2.position.set(-30, 20, -30);
                this.scene.add(spot2);

                // 4. Post Processing
                this.composer = new EffectComposer(this.renderer);
                this.composer.addPass(new RenderPass(this.scene, this.camera));

                const bloomPass = new UnrealBloomPass(
                    new THREE.Vector2(window.innerWidth, window.innerHeight),
                    0.45, // strength
                    0.4,  // radius
                    0.7   // threshold
                );
                this.composer.addPass(bloomPass);

                // 5. Build Content
                this.buildSceneContent();

                // 6. Init CV
                await this.initComputerVision();

                // 7. Event Listeners
                window.addEventListener('resize', this.onResize.bind(this));
                this.setupUIInteraction();

                // 8. Start Loop
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 1000);

                this.animate();
            }

            buildSceneContent() {
                this.mainGroup = new THREE.Group();
                this.scene.add(this.mainGroup);

                // Materials
                const matGold = new THREE.MeshStandardMaterial({
                    color: CONFIG.colors.gold, metalness: 0.8, roughness: 0.2
                });
                const matGreen = new THREE.MeshStandardMaterial({
                    color: CONFIG.colors.green, roughness: 0.8
                });
                const matRedPhys = new THREE.MeshPhysicalMaterial({
                    color: CONFIG.colors.red, metalness: 0.1, roughness: 0.1, clearcoat: 1.0
                });
                const candyTexture = createCandyCaneTexture();
                const matCandy = new THREE.MeshStandardMaterial({ map: candyTexture });

                // Geometries
                const geoBox = new THREE.BoxGeometry(0.5, 0.5, 0.5);
                const geoSphere = new THREE.SphereGeometry(0.3, 32, 32);

                // Candy Cane Geometry
                const curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(0, 1, 0),
                    new THREE.Vector3(0.2, 1.3, 0),
                    new THREE.Vector3(0.5, 1.2, 0),
                    new THREE.Vector3(0.5, 1.0, 0)
                ]);
                const geoCandy = new THREE.TubeGeometry(curve, 20, 0.1, 8, false);

                // 1. Create Tree/Decor Particles
                const height = 30;
                const totalMain = CONFIG.particleCount;

                for (let i = 0; i < totalMain; i++) {
                    const t = i / totalMain;
                    // Spiral Cone Math
                    const angle = t * 50 * Math.PI;
                    const maxRadius = 12;
                    const radius = maxRadius * (1 - t);

                    const x = Math.cos(angle) * radius;
                    const z = Math.sin(angle) * radius;
                    const y = (t * height) - (height / 2);

                    let mesh;
                    // Mix types
                    const rand = Math.random();
                    if (rand > 0.9) {
                        mesh = new THREE.Mesh(geoCandy, matCandy);
                        mesh.scale.setScalar(2);
                    } else if (rand > 0.6) {
                        mesh = new THREE.Mesh(geoSphere, rand > 0.75 ? matGold : matRedPhys);
                    } else {
                        mesh = new THREE.Mesh(geoBox, rand > 0.8 ? matGold : matGreen);
                    }

                    mesh.position.set(x, y, z);
                    mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);

                    this.mainGroup.add(mesh);
                    const p = new Particle(mesh, 'DECOR');
                    p.originalPos.set(x, y, z); // Save tree pos
                    this.particles.push(p);
                }

                // 2. Default Photo
                const photoTex = createDefaultPhotoTexture();
                this.addPhotoToScene(photoTex, true);

                // 3. Dust Particles
                const geoDust = new THREE.BufferGeometry();
                const posArr = [];
                for(let i=0; i<CONFIG.dustCount; i++) {
                    posArr.push((Math.random()-0.5)*60, (Math.random()-0.5)*60, (Math.random()-0.5)*60);
                }
                geoDust.setAttribute('position', new THREE.Float32BufferAttribute(posArr, 3));
                const matDust = new THREE.PointsMaterial({
                    color: CONFIG.colors.gold, size: 0.1, transparent: true, opacity: 0.6
                });
                const dustSystem = new THREE.Points(geoDust, matDust);
                this.mainGroup.add(dustSystem);
                // We treat dust as a single object mostly, or animate vertex shader.
                // For this request's simple "Particle Class" structure, we'll leave dust static
                // or slowly rotating container to save CPU from 2500 JS objects.
            }

            addPhotoToScene(texture, isDefault = false) {
                // Photo Frame
                const boxGeo = new THREE.BoxGeometry(3.2, 3.2, 0.2);
                const frameMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.gold, metalness: 1.0, roughness: 0.1 });

                // Photo Plane
                const planeGeo = new THREE.PlaneGeometry(3, 3);
                const photoMat = new THREE.MeshBasicMaterial({ map: texture });

                const group = new THREE.Group();
                const frame = new THREE.Mesh(boxGeo, frameMat);
                const photo = new THREE.Mesh(planeGeo, photoMat);
                photo.position.z = 0.11;

                group.add(frame);
                group.add(photo);

                // Place in Tree
                const t = isDefault ? 0.5 : Math.random() * 0.8;
                const angle = t * 50 * Math.PI + (isDefault ? 0 : Math.random());
                const r = 12 * (1 - t);
                const y = (t * 30) - 15;

                group.position.set(Math.cos(angle)*r, y, Math.sin(angle)*r);
                group.lookAt(0, y, 0); // Look outwards

                this.mainGroup.add(group);

                const p = new Particle(group, 'PHOTO');
                p.originalPos.copy(group.position);
                this.particles.push(p);

                // If user added, switch focus to it
                if (!isDefault) {
                    STATE.focusTarget = group;
                    // Optionally switch mode automatically or wait for gesture
                }
            }

            setupUIInteraction() {
                // H key to hide
                window.addEventListener('keydown', (e) => {
                    if (e.key === 'h' || e.key === 'H') {
                        const ui = document.getElementById('ui-container');
                        ui.classList.toggle('ui-hidden');
                    }
                });

                // File Upload
                const input = document.getElementById('imageInput');
                input.addEventListener('change', (e) => {
                    const f = e.target.files[0];
                    if(!f) return;

                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        new THREE.TextureLoader().load(ev.target.result, (t) => {
                            t.colorSpace = THREE.SRGBColorSpace;
                            this.addPhotoToScene(t);
                        });
                    }
                    reader.readAsDataURL(f);
                });
            }

            async initComputerVision() {
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                );

                this.handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numHands: 1
                });

                // Start webcam
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    this.video.srcObject = stream;
                    await new Promise(r => this.video.onloadedmetadata = r);
                    this.video.play();
                    this.predictWebcam();
                }
            }

            async predictWebcam() {
                let lastVideoTime = -1;
                const renderLoop = async () => {
                    if (this.video.currentTime !== lastVideoTime) {
                        lastVideoTime = this.video.currentTime;
                        const result = this.handLandmarker.detectForVideo(this.video, performance.now());
                        this.processGestures(result);
                    }
                    requestAnimationFrame(renderLoop);
                }
                renderLoop();
            }

            processGestures(result) {
                if (!result.landmarks || result.landmarks.length === 0) {
                    STATE.handData = null;
                    return;
                }

                const lm = result.landmarks[0]; // First hand
                const wrist = lm[0];
                const thumbTip = lm[4];
                const indexTip = lm[8];
                const tips = [lm[8], lm[12], lm[16], lm[20]];

                // Calculate distances
                const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);

                // Average tip distance to wrist
                let totalDist = 0;
                tips.forEach(t => {
                    totalDist += Math.hypot(t.x - wrist.x, t.y - wrist.y);
                });
                const avgTipDist = totalDist / 4;

                // Logic
                if (pinchDist < 0.05) {
                    STATE.mode = 'FOCUS';
                    // If no specific target set, pick a random photo
                    if(!STATE.focusTarget) {
                        const photos = this.particles.filter(p => p.type === 'PHOTO');
                        if(photos.length > 0) STATE.focusTarget = photos[Math.floor(Math.random()*photos.length)].mesh;
                    }
                } else if (avgTipDist < 0.25) { // Tight Fist
                    STATE.mode = 'TREE';
                } else if (avgTipDist > 0.4) { // Open Hand
                    STATE.mode = 'SCATTER';
                }

                // Interaction Mapping (Center of palm approx index 9)
                const palmCenter = lm[9];
                // Map 0..1 to -PI..PI range for rotation
                STATE.handData = {
                    x: (palmCenter.x - 0.5) * 2, // -1 to 1
                    y: (palmCenter.y - 0.5) * 2
                };
            }

            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.composer.setSize(window.innerWidth, window.innerHeight);
            }

            animate() {
                requestAnimationFrame(this.animate.bind(this));
                STATE.time += 0.01;

                // Logic: Rotate Scene based on Hand
                if (STATE.handData && STATE.mode === 'SCATTER') {
                    // Map hand X to Y rotation, Hand Y to X rotation
                    const targetRotY = STATE.handData.x * Math.PI;
                    const targetRotX = STATE.handData.y * Math.PI * 0.5;

                    this.mainGroup.rotation.y = THREE.MathUtils.lerp(this.mainGroup.rotation.y, targetRotY, 0.1);
                    this.mainGroup.rotation.x = THREE.MathUtils.lerp(this.mainGroup.rotation.x, targetRotX, 0.1);
                } else {
                    // Auto idle rotation
                    this.mainGroup.rotation.y += 0.002;
                    this.mainGroup.rotation.x = THREE.MathUtils.lerp(this.mainGroup.rotation.x, 0, 0.05);
                }

                // Update Particles
                this.particles.forEach(p => p.update(STATE.mode, STATE.focusTarget));

                this.composer.render();
            }
        }

        // Initialize
        new App();
    </script>
</body>
</html>
